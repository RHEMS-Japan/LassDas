<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LassDas 状態ボード</title>
<style>
  /* Committed single-theme cyber-HUD. Layout principle: nothing moves or
     resizes on a state change — transitions are color/glow/fill only.
     All dynamic text is rendered via textContent (never innerHTML). */
  :root {
    --ground: #020A09;
    --panel: rgba(10, 26, 24, 0.72);
    --panel-edge: #16403B;
    --ink: #C9E9E3;
    --muted: #567D77;
    --faint: #123230;
    --cyan: #41E8D2;
    --cyan-dim: rgba(65, 232, 210, 0.10);
    --lime: #9BE87A;
    --lime-dim: rgba(155, 232, 122, 0.10);
    --amber: #FFC24B;
    --amber-dim: rgba(255, 194, 75, 0.12);
    --red: #FF5E4D;
    --red-dim: rgba(255, 94, 77, 0.12);
    --white: #EAF7F4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Hiragino Sans", "Noto Sans JP", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13.5px;
    line-height: 1.65;
    min-height: 100vh;
    background-image:
      radial-gradient(1100px 600px at 80% -10%, rgba(65,232,210,0.05), transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 88px, rgba(65,232,210,0.025) 88px 89px),
      repeating-linear-gradient(90deg, transparent 0 88px, rgba(65,232,210,0.025) 88px 89px);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 48px; }
  a { color: inherit; }

  /* ---- connection banner (hidden by default) ---- */
  #conn-banner {
    display: none; position: sticky; top: 0; z-index: 50;
    background: var(--red-dim); border: 1px solid var(--red); color: var(--red);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    padding: 8px 14px; margin-bottom: 14px;
  }
  #conn-banner.on { display: block; }

  /* ---- HUD header ---- */
  header {
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
    padding: 8px 2px 12px;
    border-bottom: 1px solid var(--panel-edge);
    position: relative;
  }
  header::before, header::after {
    content: ""; position: absolute; width: 14px; height: 14px; bottom: -1px;
    border-bottom: 1px solid var(--cyan);
  }
  header::before { left: 0; border-left: 1px solid var(--cyan); }
  header::after { right: 0; border-right: 1px solid var(--cyan); }
  .brand { font-family: var(--mono); font-size: 15px; letter-spacing: 0.46em; font-weight: 400; color: var(--white); }
  .brand small { color: var(--cyan); letter-spacing: 0.34em; font-weight: 400; font-size: 9.5px; display: block; margin-top: 3px; }
  .live { display: inline-flex; align-items: center; gap: 9px; font-family: var(--mono); font-size: 11.5px; color: var(--cyan); letter-spacing: 0.2em; }
  .live.dead { color: var(--red); }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid currentColor; position: relative; }
  .live-dot::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: currentColor; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .clock { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.12em; }
  .counts { font-family: var(--mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.1em; }
  .counts b { color: var(--cyan); font-weight: 400; }
  .counts b.warn { color: var(--red); }
  /* Intake held: the attendant's one-line reason, in the requester's words. */
  .notice { margin: 12px 0 0; padding: 9px 14px; border: 1px solid var(--amber); background: var(--amber-dim); color: var(--amber); font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; line-height: 1.6; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 22px; margin-top: 24px; }
  @media (max-width: 960px) { .cols { grid-template-columns: minmax(0, 1fr); } }

  .lane-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.4em;
    color: var(--muted); text-transform: uppercase; margin: 22px 0 12px 2px;
  }
  .lane-label:first-child { margin-top: 0; }
  .lane-label::before { content: "// "; color: var(--cyan); }

  /* ---- run cards ---- */
  .runs { display: flex; flex-direction: column; gap: 18px; }
  .empty-state {
    border: 1px dashed var(--faint); color: var(--muted);
    padding: 26px 20px; text-align: center; font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    padding: 15px 18px 17px;
    position: relative;
  }
  .card::before, .card::after { content: ""; position: absolute; width: 16px; height: 16px; pointer-events: none; }
  .card::before { top: -1px; left: -1px; border-top: 1px solid var(--edge, var(--cyan)); border-left: 1px solid var(--edge, var(--cyan)); }
  .card::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--edge, var(--cyan)); border-right: 1px solid var(--edge, var(--cyan)); }
  .card.tone-act { --edge: var(--lime); }
  .card.tone-warn { --edge: var(--amber); }
  .card.tone-bad { --edge: var(--red); }
  .card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .tkey { font-family: var(--mono); font-size: 12.5px; color: var(--cyan); letter-spacing: 0.14em; text-decoration: none; }
  .tdetail { font-family: var(--mono); font-size: 11px; color: var(--cyan); border: 1px solid var(--panel-edge); border-radius: 4px; padding: 1px 7px; text-decoration: none; margin-left: 6px; }
  .tdetail:hover { background: var(--cyan-dim); }
  a.tkey:hover { text-decoration: underline; }
  .tone-act .tkey { color: var(--lime); }
  .tone-warn .tkey { color: var(--amber); }
  .tone-bad .tkey { color: var(--red); }
  .tsum { font-size: 13.5px; font-weight: 600; color: var(--white); overflow-wrap: anywhere; max-width: 46em; }
  .elapsed { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: 0.1em; }

  .nowline { display: flex; flex-direction: column; gap: 6px; margin: 9px 0 4px; }
  .now-title { font-size: 14.5px; font-weight: 600; color: var(--cyan); letter-spacing: 0.12em; overflow-wrap: anywhere; }
  .tone-act .now-title { color: var(--lime); }
  .tone-warn .now-title { color: var(--amber); }
  .tone-bad .now-title { color: var(--red); }
  .now-detail { font-size: 13px; color: var(--ink); overflow-wrap: anywhere; }

  /* ---- pipeline ---- */
  .track { display: flex; align-items: flex-start; margin-top: 16px; }
  .track.idle { opacity: 0.45; }
  .node { flex: 1; min-width: 0; position: relative; text-align: center; }
  .node .rail { position: absolute; top: 6px; left: -50%; width: 100%; height: 1px; background: var(--faint); z-index: 1; }
  .node:first-child .rail { display: none; }
  .node .rail .fill { position: absolute; inset: 0; width: 0%; background: var(--cyan); transition: width 1.1s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 8px rgba(65,232,210,0.5); }
  .node.done .rail .fill { width: 100%; }
  /* The running light lives INSIDE the fill (a moving gradient) — a
     separate sweeping element kept overshooting the rail's ends. */
  .node.now .rail .fill {
    width: 100%;
    background: linear-gradient(90deg, var(--cyan) 40%, var(--white));
    background-size: 200% 100%;
    animation: flow 1.8s linear infinite;
  }
  @keyframes flow { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .node .tick {
    width: 13px; height: 13px; border-radius: 50%; margin: 0 auto;
    background: var(--ground); border: 1px solid var(--faint);
    position: relative; z-index: 2;
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
  }
  .node .tick::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: transparent; transition: background-color 0.5s ease; }
  .node.done .tick { border-color: var(--cyan); }
  .node.done .tick::after { background: var(--cyan); }
  .node.now .tick { border-color: var(--white); box-shadow: 0 0 14px rgba(234,247,244,0.5); }
  .node.now .tick::after { background: var(--white); }
  .node .nname {
    font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 9px;
    letter-spacing: 0.3em; white-space: nowrap; transition: color 0.5s ease;
  }
  .node.done .nname { color: var(--cyan); }
  .node.now .nname { color: var(--white); }
  /* Held: the run reached this step and stopped for a person. */
  .node.hold .rail .fill { width: 100%; background: var(--amber); box-shadow: 0 0 8px var(--amber-dim); }
  .node.hold .tick { border-color: var(--amber); box-shadow: 0 0 14px var(--amber-dim); }
  .node.hold .tick::after { background: var(--amber); }
  .node.hold .nname { color: var(--amber); }
  .node .laps {
    height: 14px; margin-top: 2px;
    font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.2em;
    opacity: 0; transition: opacity 0.5s ease;
  }
  .node .laps.on { opacity: 1; }
  .node.now .laps.on { color: var(--white); }

  /* ---- decision rows ---- */
  .qrow {
    margin-top: 14px; padding: 11px 13px;
    background: var(--lime-dim); border: 1px solid rgba(155,232,122,0.3);
    font-size: 12.5px;
  }
  .qrow.state-sent { background: var(--cyan-dim); border-color: rgba(65,232,210,0.3); }
  .qrow.state-error { background: var(--red-dim); border-color: rgba(255,94,77,0.4); }
  .qrow .qtitle { color: var(--lime); letter-spacing: 0.06em; font-weight: 600; }
  .qrow.state-sent .qtitle { color: var(--cyan); }
  .qrow.state-error .qtitle { color: var(--red); }
  .answer { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; }
  .answer textarea {
    flex: 1; min-width: 0; min-height: 38px; max-height: 160px; resize: vertical;
    background: rgba(2,10,9,0.8); border: 1px solid var(--faint);
    color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 8px 11px;
    letter-spacing: 0.04em; line-height: 1.5;
  }
  .answer textarea:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 1px rgba(155,232,122,0.3); }
  .btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.26em;
    padding: 9px 17px; cursor: pointer;
    border: 1px solid var(--lime); background: transparent; color: var(--lime);
    transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--lime-dim); box-shadow: 0 0 12px rgba(155,232,122,0.25); }
  .btn:focus-visible { outline: 1px solid var(--lime); outline-offset: 2px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.go { border-color: var(--cyan); color: var(--cyan); }
  .btn.go:hover:not(:disabled) { background: var(--cyan-dim); box-shadow: 0 0 12px rgba(65,232,210,0.3); }
  .btn.armed { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 16px rgba(255,94,77,0.5); }
  .btn.ghost { border-color: var(--faint); color: var(--muted); letter-spacing: 0.1em; }
  .btn.ghost:hover:not(:disabled) { color: var(--ink); background: transparent; box-shadow: none; }
  .via { margin-top: 7px; font-size: 10.5px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.06em; }
  .approve-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; flex-wrap: wrap; }
  .guidance { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--panel-edge); font-size: 13px; line-height: 1.8; }
  .guidance p { margin: 6px 0; }
  .guidance strong { color: var(--cyan); }
  .guidance a { color: var(--cyan); }
  .guidance .evidence-links { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .guidance .files { overflow-wrap: anywhere; }
  .resolve-check { display: flex; gap: 8px; align-items: baseline; margin: 12px 0; cursor: pointer; }

  /* ---- event log ---- */
  .log { background: rgba(2,10,9,0.85); border: 1px solid var(--panel-edge); padding: 13px 0; max-height: 620px; overflow-y: auto; }
  .ev {
    display: grid; grid-template-columns: 50px 1fr; gap: 10px; padding: 6px 15px;
    border-left: 1px solid transparent;
    transition: background-color 1.4s ease, border-color 1.4s ease;
  }
  .ev.enter { max-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; overflow: hidden; }
  .ev.settling {
    max-height: 90px; padding-top: 6px; padding-bottom: 6px; opacity: 1;
    transition: max-height 0.5s ease, padding 0.5s ease, opacity 0.7s ease 0.15s,
      background-color 1.4s ease, border-color 1.4s ease;
  }
  .ev.fresh { border-left-color: var(--cyan); background: var(--cyan-dim); }
  .ev time { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; letter-spacing: 0.08em; }
  .ev .ekey { font-family: var(--mono); font-size: 10.5px; color: var(--cyan); letter-spacing: 0.12em; }
  .ev .emsg { font-size: 12px; }
  .ev-day {
    padding: 6px 15px; color: var(--faint); font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; text-align: center;
  }

  /* ---- finished lane ---- */
  .livepane { margin-top: 10px; border: 1px solid var(--panel-edge); background: rgba(0,0,0,0.55); border-radius: 6px; display: none; }
  .livepane.on { display: block; }
  .livepane .lphead { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-bottom: 1px solid var(--faint); color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .livepane .lphead b { color: var(--ink); text-transform: none; letter-spacing: 0; }
  .livepane .lphead .pin { margin-left: auto; color: var(--muted); }
  .livepane pre { margin: 0; padding: 8px 10px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.5; color: var(--ink); }
  .node { cursor: default; }
  .node.hasLive .nname { text-decoration: underline dotted var(--muted); text-underline-offset: 3px; cursor: pointer; }
  /* While a pane is pinned the other rails do not answer a hover, so they
     stop offering to: an underline and a pointer cursor on something that
     does nothing reads as broken (review of #200). */
  body.livePinned .node.hasLive .nname { text-decoration: none; cursor: default; }
  body.livePinned .card.pinnedHost .node.hasLive .nname { text-decoration: underline dotted var(--muted); cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11.5px; padding: 6px 12px;
    background: var(--panel); border: 1px solid var(--panel-edge);
    color: var(--muted); font-family: var(--mono); letter-spacing: 0.06em;
    text-decoration: none;
    cursor: pointer; flex-wrap: wrap; max-width: 100%;
  }
  .finished-run { min-width: 0; }
  .finished-run[open] { flex-basis: 100%; }
  .finished-run > .card { margin-top: 8px; }
  .finished-run > summary::after { content: "詳細を見る ▾"; color: var(--cyan); }
  .finished-run[open] > summary::after { content: "閉じる ▴"; }
  .chip:hover { border-color: var(--muted); }
  .chip .ckey { color: var(--ink); }
  .chip .mark { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.ok .mark { background: var(--cyan); }
  .chip.stop .mark { background: var(--muted); }
  .chip.bad .mark { background: var(--red); }

  footer { margin-top: 34px; color: var(--faint); font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em; }

  @media (prefers-reduced-motion: reduce) {
    .live-dot::after, .node.now .rail .fill { animation: none !important; }
    .ev.enter, .ev.settling { transition: none !important; max-height: none; opacity: 1; padding: 6px 15px; }
    .node .rail .fill, .node .tick, .node .tick::after, .node .nname, .node .laps { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="conn-banner" role="alert">接続が切れています — 再接続を試みています。表示は最後に受信した状態のままです</div>

  <header>
    <div class="brand">LASSDAS<small>TACTICAL OVERWATCH</small></div>
    <span class="live" id="live"><span class="live-dot"></span><span id="live-text">接続中…</span></span>
    <span class="counts" id="counts"></span>
    <span class="clock"><span id="ago">—</span></span>
  </header>
  <div id="notice-banner" class="notice" role="status" hidden></div>

  <div class="cols">
    <div>
      <p class="lane-label">進行中の依頼</p>
      <div class="runs" id="runs"></div>
      <p class="lane-label">完了・終了</p>
      <div class="chips" id="chips"></div>
    </div>
    <div>
      <p class="lane-label">運行ログ</p>
      <div class="log" id="log"></div>
    </div>
  </div>

  <footer id="footer">LASSDAS STATUS BOARD — 表示は変化から数秒で追従します。新しい依頼の受付と Go の検知は毎分の見回りです。</footer>
</div>

<script>
"use strict";
/* All dynamic content is DOM-built with textContent — tracker-controlled
   strings (titles, details) must never reach innerHTML. */

const STEPS = [
  ["intake", "受付"], ["investigate", "調査"], ["design", "設計"], ["implement", "実装"], ["review", "審査"], ["checks", "検査"],
  ["staging", "STG"], ["confirm", "確認"], ["production", "本番"],
];
const STEP_INDEX = Object.fromEntries(STEPS.map(([id], i) => [id, i]));
const RESTING = new Set(["done", "stopped", "failed"]);
const ACTIONABLE = new Set(["confirm", "question"]);
const TONE = { confirm: "tone-act", question: "tone-act", attention: "tone-warn", failed: "tone-bad", stopped: "", done: "" };

const el = (tag, className, text) => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
};

/* ---- state ---- */
let lastPayloadAt = 0;       // ms, local receive time
let lastServerSentAt = null; // ISO from server
let trackerBase = "";
let actionsEnabled = false;
let sentActions = new Map(); // "action:issue" -> at
const localPending = new Map(); // same key -> "sending" | "error:<msg>"
const knownEvents = new Set();
const cardStates = new Map(); // delivery_id -> {armed, armTimer, countdown}
const expandedRuns = new Set();
// Reserved for the answer phase (issue #14): drafts and the caret
// restoration below are dormant until the board grows an answer box
// again — nothing writes them today.
const drafts = new Map(); // issue_id -> text

/* ---- rendering ---- */
function trackerURL(issueKey) {
  if (!trackerBase || !issueKey) return null;
  return trackerBase.replace(/\/$/, "") + "/view/" + encodeURIComponent(issueKey);
}

function buildTrack(container, issueKey, pane) {
  for (const [id, name] of STEPS) {
    const node = el("div", "node");
    node.dataset.step = id;
    if (issueKey && pane) wireLive(node, issueKey, id, name, pane);
    const rail = el("div", "rail");
    rail.appendChild(el("div", "fill"));
    node.appendChild(rail);
    node.appendChild(el("div", "tick"));
    node.appendChild(el("div", "nname", name));
    node.appendChild(el("div", "laps", "×1"));
    container.appendChild(node);
  }
}

function setTrack(container, stepID, round, stage) {
  // An out-of-line state (attention) names the step it stopped at via
  // `stage`; that node is held (amber), not running (white). Without the
  // hint the whole rail went dark for a run that had reached staging.
  let current = STEP_INDEX[stepID];
  let held = false;
  if (current === undefined && stage !== undefined && STEP_INDEX[stage] !== undefined) {
    current = STEP_INDEX[stage];
    held = true;
  }
  if (current === undefined && stepID === "reporting") {
    // The run has finished its work and is writing its report. Every
    // stage behind it is done; none is running. Without this the rail
    // went dark at the end of a delivery that had completed all of them
    // (review of #200).
    current = STEPS.length;
  }
  container.classList.toggle("idle", current === undefined);
  container.querySelectorAll(".node").forEach((node, index) => {
    node.classList.toggle("done", current !== undefined && index < current);
    node.classList.toggle("now", current !== undefined && index === current && !held);
    node.classList.toggle("hold", current !== undefined && index === current && held);
    const laps = node.querySelector(".laps");
    const showLaps = round > 1 && (node.dataset.step === "implement" || node.dataset.step === "review");
    laps.textContent = "×" + (showLaps ? round : 1);
    laps.classList.toggle("on", showLaps);
  });
}

/* ---- the live view: what a stage is producing, while it produces it ----
   Hovering a stage of the rail opens its output; clicking pins it open so a
   reader can scroll it. Only whole lines arrive, already masked by the
   engine that wrote them. */
// pointerAt is where the pointer was last seen. Until it has moved once
// there is nothing to ask, and an unpinned pane is not restored - the
// reader is not there as far as anything can tell.
let pointerAt = null;
const rememberPointer = event => { pointerAt = { x: event.clientX, y: event.clientY }; };
document.addEventListener("mousemove", rememberPointer, { passive: true });
// A reader whose cursor was already over the rail when the page loaded has
// moved nothing, and without a position an unpinned pane would be given up
// on the first refresh. Entering a rail node is itself a position (review
// of #200).
document.addEventListener("mouseover", rememberPointer, { passive: true });

function pointerIsOver(node) {
  if (!pointerAt || !document.elementFromPoint) return false;
  const under = document.elementFromPoint(pointerAt.x, pointerAt.y);
  return !!under && (under === node || node.contains(under));
}

// closeOtherPanes stops every pane but this one.
function closeOtherPanes(keep) {
  const runsBox = document.getElementById("runs");
  if (!runsBox) return;
  for (const pane of runsBox.querySelectorAll(".livepane")) {
    if (pane !== keep && pane.classList.contains("on")) {
      pane.state.pinned = false;
      liveDetach(pane);
    }
  }
}

// maxCarriedText bounds what a pane keeps across refreshes. Without it the
// text carried forward grew by everything that arrived between refreshes
// and nothing ever cut it back: a stage is up to a dozen steps of a
// megabyte each, and a pinned pane read the whole accumulation out and
// wrote it back about once a minute (review of #200).
const maxCarriedText = 64 * 1024;

// trimForCarry keeps the end of what the reader has, from a line boundary,
// and says that the beginning was dropped.
function trimForCarry(text) {
  if (text.length <= maxCarriedText) return text;
  const tail = text.slice(text.length - maxCarriedText);
  const start = tail.indexOf("\n");
  return "── 以前の分は表示から外しました ──\n" + (start < 0 ? tail : tail.slice(start + 1));
}

// deliveryIDOf names the card a pane belongs to, which is what the follow
// is keyed on.
function deliveryIDOf(pane) {
  const card = pane.closest(".card");
  return (card && card.dataset.delivery) || "";
}

function buildLivePane() {
  const pane = el("div", "livepane");
  const head = el("div", "lphead");
  head.appendChild(el("span", null, "実況"));
  head.appendChild(el("b", null, ""));
  head.appendChild(el("span", "pin", ""));
  pane.appendChild(head);
  pane.appendChild(el("pre"));
  pane.state = { timer: null, from: 0, step: null, header: null, idle: false, offsets: {}, rendered: false, pinned: false, stage: null };
  return pane;
}

function liveStop(pane) {
  if (pane.state.timer) clearTimeout(pane.state.timer);
  pane.state.timer = null;
}

// liveFollow is the stage the reader is watching, kept outside the cards
// because every card is rebuilt whenever the server sends a payload. Without
// it the pane a reader was reading vanished on the next refresh — about once
// a minute, and immediately on any event — which looks exactly like a stage
// whose live output does not work (live 2026-09-17).
let liveFollow = null; // {deliveryID, issueKey, stage, stageName, pinned}

function liveClose(pane) {
  // Only this pane's own follow is given up here. A pinned pane is the
  // reader saying "keep this open", and a pointer leaving a different
  // ticket's rail must not take it back - the pointer that left was never
  // on it (review of #200).
  if (liveFollow && !liveFollow.pinned && liveFollow.deliveryID === deliveryIDOf(pane)) {
    setFollow(null);
  }
  liveDetach(pane);
}

// liveDetach stops a pane without forgetting what it was following, for the
// rebuild: liveRestore opens the new card's pane on the same stage.
function liveDetach(pane) {
  // What the reader had. Every card is rebuilt on every payload, so
  // without this a pinned pane went back to "読み込み中…" about once a
  // minute and re-read its log from the beginning, losing the place the
  // reader had scrolled to (review of #200).
  if (liveFollow && liveFollow.deliveryID === deliveryIDOf(pane) && pane.classList.contains("on") && pane.state.rendered) {
    // Only real output is carried. The pane's other two states are
    // sentences - "読み込み中…" and "この工程の実況はまだありません。" -
    // and carrying one left it sitting above the output that arrived
    // afterwards, with nothing left to clear it (review of #200).
    const body = pane.querySelector("pre");
    liveFollow.resume = {
      text: trimForCarry(body.textContent), step: pane.state.step, from: pane.state.from,
      offsets: pane.state.offsets, scrollTop: body.scrollTop,
      atBottom: body.scrollTop + body.clientHeight >= body.scrollHeight - 24,
    };
  }
  liveStop(pane);
  pane.classList.remove("on");
  pane.state.step = null;
  pane.state.stage = null;
  pane.state.from = 0;
  pane.state.header = null;
  pane.state.idle = false;
  pane.state.offsets = {};
  pane.state.rendered = false;
  pane.querySelector("pre").textContent = "";
}

// liveRestore reopens the followed stage on the rebuilt card. A run that has
// left the board takes its pane with it, and the follow ends there.
// markPinned tells the page whether a pane is pinned, so the rails that
// will not answer a hover stop offering to.
function markPinned() {
  const pinned = !!(liveFollow && liveFollow.pinned);
  document.body.classList.toggle("livePinned", pinned);
  const runsBox = document.getElementById("runs");
  if (!runsBox) return;
  for (const card of runsBox.querySelectorAll(".card")) {
    card.classList.toggle("pinnedHost", pinned && card.dataset.delivery === liveFollow.deliveryID);
  }
}

// setFollow is the only way the follow changes, so what the page shows can
// never drift from it. Updating it by hand in two places left every rail
// looking inert for ever once a pinned ticket left the board (review of
// #200).
function setFollow(value) {
  liveFollow = value;
  markPinned();
}

function liveRestore(runsBox) {
  if (!liveFollow) return;
  const follow = liveFollow;
  // By delivery, not by ticket: the same ticket can have two deliveries on
  // the board, and the first card with that key is not necessarily the one
  // the reader was on (review of #200).
  const card = runsBox.querySelector('.card[data-delivery="' + CSS.escape(follow.deliveryID) + '"]');
  const pane = card && card.querySelector(".livepane");
  const node = card && card.querySelector('.node[data-step="' + CSS.escape(follow.stage) + '"]');
  if (!pane || !node) {
    setFollow(null);
    return;
  }
  // An unpinned pane belongs to the pointer. After a rebuild the old nodes
  // are gone without a mouseleave and a focused one never blurs, so the
  // pointer is the only thing that still says whether the reader is there.
  //
  // It is asked by coordinate, not by asking the new node whether it is
  // hovered: the rebuild and this call are one synchronous task, and the
  // browser has had no chance to move its hover chain onto elements
  // created three lines ago. elementFromPoint hit-tests on demand and
  // answers about the tree as it is now (review of #200).
  if (!follow.pinned && !pointerIsOver(node)) {
    setFollow(null);
    return;
  }
  pane.state.pinned = follow.pinned;
  const resume = follow.resume;
  follow.resume = null;
  liveOpen(pane, follow.issueKey, follow.stage, follow.stageName, resume);
}

function liveOpen(pane, issueKey, stage, stageName, resume) {
  // One pane at a time. Two open panes each poll, each say "固定中", and
  // the next refresh keeps whichever the follow names and drops the other
  // without the reader asking (review of #200).
  closeOtherPanes(pane);
  // A pinned pane elsewhere is not displaced by a pointer wandering over
  // another rail; the reader unpins it or clicks somewhere else.
  if (!liveFollow || !liveFollow.pinned || pane.state.pinned) {
    setFollow({
      deliveryID: deliveryIDOf(pane), issueKey: issueKey,
      stage: stage, stageName: stageName, pinned: pane.state.pinned,
    });
  }
  if (pane.state.stage === stage && pane.classList.contains("on")) return;
  liveStop(pane);
  pane.state = Object.assign(pane.state, { from: 0, step: null, header: null, idle: false, offsets: {}, rendered: false, stage: stage });
  pane.classList.add("on");
  pane.querySelector(".lphead b").textContent = stageName;
  pane.querySelector(".lphead .pin").textContent = pane.state.pinned ? "固定中 (もう一度クリックで解除)" : "クリックで固定";
  if (resume) {
    // Carried across the rebuild: the same text, the same place in each
    // step's file, the same place on the page, and no "読み込み中…" in
    // between.
    const body = pane.querySelector("pre");
    body.textContent = resume.text;
    pane.state.step = resume.step;
    pane.state.from = resume.from;
    pane.state.offsets = resume.offsets || {};
    pane.state.rendered = true;
    // The index is asked on the first tick after a carry: a step can
    // finish while the board is rebuilding, and a pane that kept its step
    // and never looked again sat on dead output for ever (review of #200).
    pane.state.idle = true;
    if (resume.atBottom) {
      body.scrollTop = body.scrollHeight;
    } else {
      body.scrollTop = resume.scrollTop || 0;
    }
    liveTick(pane, issueKey, stage, false);
    return;
  }
  pane.querySelector("pre").textContent = "読み込み中…";
  liveTick(pane, issueKey, stage, true);
}

function liveTick(pane, issueKey, stage, first) {
  const body = pane.querySelector("pre");
  // The newest writer of this stage, asked again every tick. A stage is
  // several steps one after another, and following only the one that was
  // newest when the pane opened left the reader watching a step that had
  // finished while the stage carried on (live 2026-09-17).
  const unreachable = {};
  // The index is asked when there is no step yet, and after that only when
  // the one being followed has stopped growing. A stage is several steps in
  // a row, so the pane has to notice the hand-over - but asking every tick
  // doubled the requests and made the newest writer flip back and forth
  // (review of #200).
  //
  // The hand-over is therefore noticed a tick late, and not at all while
  // the step being followed writes something every single second and
  // another step of the same stage runs beside it. Both at once is rare;
  // a step that writes less often than the tick leaves a quiet tick, which
  // is when the pane looks again.
  const pick = (pane.state.step && !pane.state.idle)
    ? Promise.resolve(pane.state.step)
    : fetch("/api/tickets/" + encodeURIComponent(issueKey) + "/live", { headers: { Accept: "application/json" } })
      .then(r => r.ok ? r.json() : unreachable)
      .then(index => {
        if (index === unreachable) return unreachable;
        // Ties broken by name, because two files written in the same
        // millisecond otherwise came back in whichever order the sort
        // happened to produce, and the pane announced a hand-over each
        // time it changed its mind (review of #200).
        const match = (index.steps || []).filter(s => s.stage === stage)
          .sort((a, b) => b.updated_at_ms - a.updated_at_ms || a.step.localeCompare(b.step))[0];
        return match ? match.step : pane.state.step;
      })
      .catch(() => unreachable);
  pick.then(step => {
    if (pane.state.stage !== stage) return;
    if (step === unreachable) {
      // The board could not be reached. That is not "this stage has
      // produced nothing"; saying so would put the very sentence this
      // pane exists to remove in front of a reader whose network blinked
      // (review of #200).
      if (first) body.textContent = "読み込み中…";
      pane.state.timer = setTimeout(() => liveTick(pane, issueKey, stage, first), 4000);
      return;
    }
    if (!step) {
      if (first) body.textContent = "この工程の実況はまだありません。";
      pane.state.timer = setTimeout(() => liveTick(pane, issueKey, stage, false), 3000);
      return;
    }
    if (pane.state.step && pane.state.step !== step) {
      // The stage moved on. It resumes where this step was left rather
      // than at its beginning: the newest writer can be one the reader
      // already watched - a step is appended to by more than one phase -
      // and starting again pasted its whole output a second time (review
      // of #200). What is already in the pane stays: a stage is six steps
      // in a row at its longest, and clearing on each one emptied a pinned
      // pane under the reader.
      pane.state.from = pane.state.offsets[step] || 0;
      pane.state.header = step;
    }
    pane.state.step = step;
    return fetch("/api/tickets/" + encodeURIComponent(issueKey) + "/live/" + encodeURIComponent(step) + "?from=" + pane.state.from, { headers: { Accept: "application/json" } })
      .then(r => r.ok ? r.json() : null)
      .then(chunk => {
        if (pane.state.stage !== stage) return;
        if (!chunk) {
          // Same reasoning: try again rather than stop for ever.
          pane.state.timer = setTimeout(() => liveTick(pane, issueKey, stage, first), 4000);
          return;
        }
        // Cleared when the pane opens, and when the server rewound us
        // because the file it was reading was replaced by a newer run. Not
        // on a step change: a step that has started and written nothing
        // yet is the ordinary case, and clearing there emptied the pane
        // under the reader one tick after the hand-over (review of #200).
        const rewound = chunk.from === 0 && (pane.state.offsets[step] || 0) > 0;
        // The answer starts later than what was asked for: the log is
        // already longer than one answer carries. Noted after the clear
        // below, not before it - written first, the clear took it away in
        // the one case that needs it most, opening a pane on a log that
        // was long before anybody looked (review of #200).
        const skipped = chunk.from > pane.state.from;
        if (first || rewound) body.textContent = "";
        if (skipped) {
          body.appendChild(document.createTextNode("── 中略 (表示できる量を超えたため、途中を飛ばしました) ──\n"));
          pane.state.rendered = true;
        }
        if (pane.state.header) {
          // The pane may still be showing the sentence it waits behind;
          // the incoming step's name goes on its own, not after it.
          if (!pane.state.rendered) body.textContent = "";
          body.appendChild(document.createTextNode("── " + pane.state.header + " ──\n"));
          pane.state.header = null;
        }
        if (chunk.text) {
          pane.state.rendered = true;
          const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 24;
          body.appendChild(document.createTextNode(chunk.text));
          if (atBottom) body.scrollTop = body.scrollHeight;
        } else if (!body.textContent) {
          body.textContent = "この工程の実況はまだありません。";
        }
        pane.state.from = chunk.next;
        pane.state.offsets[step] = chunk.next;
        // Nothing new: ask the index again next time in case the stage has
        // handed over to another step.
        pane.state.idle = !chunk.text;
        pane.state.timer = setTimeout(() => liveTick(pane, issueKey, stage, false), 1000);
      });
  }).catch(() => {
    // The same guard the success paths carry: a pane closed while its
    // request was in flight must not schedule another one, or a board that
    // is briefly unreachable leaves one unstoppable loop per refresh.
    if (pane.state.stage !== stage) return;
    pane.state.timer = setTimeout(() => liveTick(pane, issueKey, stage, false), 4000);
  });
}

function wireLive(node, issueKey, stage, stageName, pane) {
  node.classList.add("hasLive");
  node.tabIndex = 0;
  // A pinned pane anywhere holds the view: the pointer wandering over
  // another rail neither displaces it nor opens a second one beside it.
  // Clicking still pins the new stage, which is the reader asking.
  const open = () => {
    if (pane.state.pinned) return;
    if (liveFollow && liveFollow.pinned) return;
    liveOpen(pane, issueKey, stage, stageName);
  };
  node.addEventListener("mouseenter", open);
  node.addEventListener("focus", open);
  node.addEventListener("mouseleave", () => { if (!pane.state.pinned) liveClose(pane); });
  node.addEventListener("blur", () => { if (!pane.state.pinned) liveClose(pane); });
  node.addEventListener("click", () => {
    if (pane.state.pinned && pane.state.stage === stage) {
      // Both halves: the pane stops being pinned and the follow goes with
      // it. Leaving the follow pinned made the pane reopen on the next
      // refresh, pinned, so the reader could never put it away (review of
      // #200).
      pane.state.pinned = false;
      setFollow(null);
      liveClose(pane);
      return;
    }
    pane.state.pinned = false;
    liveOpen(pane, issueKey, stage, stageName);
    pane.state.pinned = true;
    setFollow({
      deliveryID: deliveryIDOf(pane), issueKey: issueKey,
      stage: stage, stageName: stageName, pinned: true,
    });
    pane.querySelector(".lphead .pin").textContent = "固定中 (もう一度クリックで解除)";
  });
  node.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); node.click(); } });
}

function fmtElapsed(claimedAtMs) {
  if (!claimedAtMs) return "";
  const total = Math.max(0, Math.floor((Date.now() - claimedAtMs) / 1000));
  const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
  return "経過 " + (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}

function actKey(action, issueID, deliveryID) { return action + ":" + issueID + (action === "resolve" ? ":" + (deliveryID || "") : ""); }

async function postAction(action, issueID, text, onDone, deliveryID) {
  const key = actKey(action, issueID, deliveryID);
  localPending.set(key, "sending");
  renderBoard();
  try {
    const response = await fetch("/api/act", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, issue_id: issueID, text: text || "", delivery_id: deliveryID }),
    });
    if (!response.ok) {
      const body = await response.text();
      localPending.set(key, "error:" + (body || response.status).toString().slice(0, 120));
    } else {
      localPending.delete(key);
      sentActions.set(key, new Date().toISOString());
    }
  } catch (error) {
    localPending.set(key, "error:通信に失敗しました。再試行してください");
  }
  if (onDone) onDone();
  renderBoard();
}

function decisionState(action, issueID, deliveryID) {
  const key = actKey(action, issueID, deliveryID);
  if (localPending.has(key)) {
    const value = localPending.get(key);
    return value === "sending" ? { kind: "sending" } : { kind: "error", message: value.slice(6) };
  }
  if (sentActions.has(key)) {
    // The "sent" veil only bridges the gap until the server reacts; past
    // that, the server state (the card's own step) is the truth — and a
    // journal line falling out of the tail window must not resurrect a
    // button either way.
    const at = Date.parse(sentActions.get(key) || "");
    if (!Number.isNaN(at) && Date.now() - at < 15 * 60 * 1000) return { kind: "sent" };
  }
  return { kind: "idle" };
}

function buildQuestionRow(run) {
  // Answering from the board stays closed (issue #14 phase 2): the intake
  // grammar is not carried here yet, and a send that never gets adopted
  // is worse than no button.
  const row = el("div", "qrow");
  row.appendChild(el("div", "qtitle", "作業を進めるための質問がチケットにあります"));
  const link = trackerURL(run.issue_key);
  if (link) {
    const via = el("div", "via");
    const anchor = el("a", null, "チケットを開いて質問を確認・回答する ↗");
    anchor.href = link; anchor.target = "_blank"; anchor.rel = "noopener";
    via.appendChild(anchor);
    row.appendChild(via);
  }
  row.appendChild(el("div", "via", "チケットの最新の質問にある回答例を使い、依頼者本人のコメントとして返信してください。回答後の進行はこの画面で確認できます。"));
  return row;
}

function buildGoRow(run) {
  const row = el("div", "approve-row");
  const goState = decisionState("go", run.issue_id);
  const stopState = decisionState("stop", run.issue_id);
  if (goState.kind === "sent") {
    const note = el("div", "qrow state-sent");
    note.appendChild(el("div", "qtitle", "✓ Go をチケットへ投稿しました"));
    note.appendChild(el("div", "via", "自動処理が次の見回りで承認を確認すると、本番反映へ進みます。投稿した時点では反映は完了していません。進行はこのボードに表示します"));
    return note;
  }
  if (stopState.kind === "sent") {
    const note = el("div", "qrow state-sent");
    note.appendChild(el("div", "qtitle", "✓ 停止をチケットへ投稿しました"));
    note.appendChild(el("div", "via", "LassDas が次の見回りで検知し、本番反映を行わず停止します"));
    return note;
  }
  const cardState = cardStates.get(run.delivery_id) || {};
  const go = el("button", "btn go", "Go — 本番反映を承認");
  const hold = el("button", "btn ghost", "反映しない (停止を送信)");
  const via = el("span", "via", "どちらもチケットへあなた本人のコメントとして投稿されます");
  const sending = goState.kind === "sending" || stopState.kind === "sending";
  if (sending) { go.disabled = true; hold.disabled = true; go.textContent = "送信中…"; }
  else if (cardState.armed) {
    go.classList.add("armed");
    go.textContent = "もう一度押して確定 (" + cardState.countdown + ")";
  }
  go.addEventListener("click", () => {
    const state = cardStates.get(run.delivery_id) || {};
    if (!state.armed) {
      state.armed = true;
      state.countdown = 10;
      clearInterval(state.armTimer);
      state.armTimer = setInterval(() => {
        const current = cardStates.get(run.delivery_id);
        if (!current || !current.armed) return;
        current.countdown--;
        if (current.countdown <= 0) { current.armed = false; clearInterval(current.armTimer); }
        renderBoard();
      }, 1000);
      cardStates.set(run.delivery_id, state);
      renderBoard();
      return;
    }
    state.armed = false;
    clearInterval(state.armTimer);
    postAction("go", run.issue_id);
  });
  hold.addEventListener("click", () => {
    const state = cardStates.get(run.delivery_id) || {};
    if (state.armed) { state.armed = false; clearInterval(state.armTimer); renderBoard(); return; }
    if (!confirm("本番反映を行わず停止します。チケットに「停止」を投稿しますか？")) return;
    postAction("stop", run.issue_id);
  });
  row.appendChild(go);
  row.appendChild(hold);
  row.appendChild(via);
  if (goState.kind === "error" || stopState.kind === "error") {
    const err = el("div", "qrow state-error");
    err.appendChild(el("div", "qtitle", "投稿に失敗しました: " + (goState.kind === "error" ? goState.message : stopState.message)));
    err.appendChild(el("div", "via", "もう一度お試しください"));
    row.appendChild(err);
  }
  return row;
}

function buildGuidance(run) {
  const box = el("div", "guidance");
  const paragraph = (label, text) => {
    if (!text) return;
    const p = el("p");
    p.appendChild(el("strong", null, label + "　"));
    p.appendChild(document.createTextNode(text));
    box.appendChild(p);
  };
  const links = el("div", "evidence-links");
  const addLink = (label, href) => {
    try {
      const url = new URL(href);
      if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password) return;
      const a = el("a", null, label + " ↗");
      a.href = url.href; a.target = "_blank"; a.rel = "noopener noreferrer";
      links.appendChild(a);
    } catch (_) { /* absent or invalid evidence is not a clickable destination */ }
  };
  addLink("PR の変更内容・マージ状態", run.pr_url);
  addLink("チケットの報告・確認条件", trackerURL(run.issue_key));
  if (links.childNodes.length) box.appendChild(links);
  if (run.changed_files && run.changed_files.length) {
    const files = el("details", "files");
    files.appendChild(el("summary", null, "変更ファイル（" + run.changed_files.length + "件）"));
    const list = el("ul");
    for (const file of run.changed_files) list.appendChild(el("li", null, file));
    files.appendChild(list); box.appendChild(files);
  }
  const reportAt = Date.parse(run.report_at || "");
  if (Number.isFinite(reportAt) && reportAt > 0) {
    paragraph("判定した時刻", new Date(reportAt).toLocaleString("ja-JP") + "（現在の実環境を再確認した結果ではありません）");
  }
  paragraph("次にすること", run.next_action);
  paragraph("操作すると", run.action_effect);
  if (run.can_go && !actionsEnabled) {
    paragraph("承認の方法", "この画面は閲覧専用です。チケットの報告を確認し、依頼者本人が先頭行に「Go」または「停止」と書いてコメントしてください。");
  }
  if (run.can_resolve) {
    if (actionsEnabled && run.issue_id) box.appendChild(buildResolveRow(run));
    else paragraph("確認の記録", "この画面は閲覧専用です。確認と必要な対応を終えたら、依頼者または登録された運用担当者が、チケットの先頭行に「確認済み」と書いてコメントしてください。");
  }
  return box;
}

function buildResolveRow(run) {
  const row = el("div");
  const state = decisionState("resolve", run.issue_id, run.delivery_id);
  row.setAttribute("aria-live", "polite");
  if (state.kind === "sent") {
    row.appendChild(el("p", null, "✓ 確認済みをチケットへ投稿しました。まだ終了処理の完了前です。自動処理が受け取ると、この依頼は「確認済み」に移ります。"));
    return row;
  }
  const label = el("label", "resolve-check");
  const checked = el("input"); checked.type = "checkbox";
  checked.checked = !!(cardStates.get(run.delivery_id) || {}).confirmed;
  label.appendChild(checked);
  label.appendChild(document.createTextNode("変更内容と反映結果を確認し、必要な対応を終えました"));
  row.appendChild(label);
  const button = el("button", "btn", state.kind === "sending" ? "確認を送信中…" : "確認を記録して閉じる");
  button.disabled = !checked.checked || state.kind === "sending";
  checked.disabled = state.kind === "sending";
  checked.addEventListener("change", () => {
    const card = cardStates.get(run.delivery_id) || {};
    card.confirmed = checked.checked; cardStates.set(run.delivery_id, card);
    button.disabled = !checked.checked;
  });
  button.addEventListener("click", () => postAction("resolve", run.issue_id, "", null, run.delivery_id));
  row.appendChild(button);
  row.appendChild(el("p", "via", "依頼者のコメントとして「確認済み」を投稿します。変更内容やデプロイ結果を書き換える操作ではありません。"));
  if (state.kind === "error") row.appendChild(el("p", "state-error", "送信結果を確認できませんでした: " + state.message + " チケットに投稿があるか確認してから、必要なら再送してください。"));
  return row;
}

function buildCard(run) {
  const card = el("div", "card");
  if (run.issue_key) card.dataset.issueKey = run.issue_key;
  // One attribute for the delivery, read by the live pane's follow.
  card.dataset.delivery = run.delivery_id;
  const tone = TONE[run.step];
  if (tone) card.classList.add(tone);

  const head = el("div", "card-head");
  const link = trackerURL(run.issue_key);
  if (link) {
    const anchor = el("a", "tkey", run.issue_key || run.delivery_id);
    anchor.href = link; anchor.target = "_blank"; anchor.rel = "noopener";
    head.appendChild(anchor);
  } else {
    head.appendChild(el("span", "tkey", run.issue_key || run.delivery_id));
  }
  const summary = el("span", "tsum", run.summary || "");
  summary.title = run.summary || "";
  head.appendChild(summary);
  if (run.issue_key) {
    const detail = el("a", "tdetail", "詳細");
    detail.href = "/tickets/" + encodeURIComponent(run.issue_key);
    detail.title = "この票で起きたこと全部と証拠";
    head.appendChild(detail);
  }
  const elapsed = el("span", "elapsed", fmtElapsed(run.claimed_at_ms));
  elapsed.dataset.claimed = run.claimed_at_ms || 0;
  head.appendChild(elapsed);
  card.appendChild(head);

  const nowline = el("div", "nowline");
  nowline.appendChild(el("span", "now-title", run.step_title || ""));
  nowline.appendChild(el("span", "now-detail", run.detail || ""));
  card.appendChild(nowline);

  const track = el("div", "track");
  const pane = buildLivePane();
  buildTrack(track, run.issue_key, pane);
  setTrack(track, run.step, run.round || 0, run.stage);
  card.appendChild(track);
  card.appendChild(pane);

  if (run.next_action || run.can_resolve || run.can_go) card.appendChild(buildGuidance(run));

  if (run.step === "question") card.appendChild(buildQuestionRow(run));
  // The Go/stop controls appear ONLY when the server says a Go would be
  // honoured right now (can_go) — never on a file-only confirm, never
  // during the legacy observation step.
  if (actionsEnabled && run.issue_id && run.step === "confirm" && run.can_go) {
    card.appendChild(buildGoRow(run));
  }
  return card;
}

function buildChip(run) {
  const details = el("details", "finished-run");
  details.open = expandedRuns.has(run.delivery_id);
  details.addEventListener("toggle", () => {
    if (details.open) expandedRuns.add(run.delivery_id);
    else expandedRuns.delete(run.delivery_id);
  });
  const chip = el("summary", "chip");
  chip.classList.add(run.step === "done" ? "ok" : run.step === "stopped" ? "stop" : "bad");
  chip.appendChild(el("span", "mark"));
  chip.appendChild(el("span", "ckey", run.issue_key || run.delivery_id));
  chip.appendChild(el("span", null, run.step_title || run.step));
  details.appendChild(chip);
  details.appendChild(buildCard(run));
  return details;
}

let latestBoard = { runs: [] };

function renderBoard() {
  // A redraw replaces the DOM; if the user is typing an answer, carry the
  // caret across so the input never visibly jumps.
  const focused = document.activeElement;
  const focusDraft = focused && focused.dataset ? focused.dataset.draftFor : null;
  const caret = focusDraft ? [focused.selectionStart, focused.selectionEnd] : null;
  const runs = (latestBoard.runs || []).slice();
  const active = runs.filter(run => !RESTING.has(run.step));
  const resting = runs.filter(run => RESTING.has(run.step));
  active.sort((a, b) => {
    const aAct = ACTIONABLE.has(a.step) ? 0 : 1;
    const bAct = ACTIONABLE.has(b.step) ? 0 : 1;
    if (aAct !== bAct) return aAct - bAct;
    return (b.claimed_at_ms || 0) - (a.claimed_at_ms || 0);
  });

  const runsBox = document.getElementById("runs");
  // Every card is rebuilt on each payload; a live pane still following a
  // step would keep asking for it from a card nobody can see (review of
  // #187).
  for (const pane of runsBox.querySelectorAll(".livepane")) liveDetach(pane);
  runsBox.replaceChildren();
  if (active.length === 0) {
    runsBox.appendChild(el("div", "empty-state", "進行中の依頼はありません — チケットの起票で自動的にここに現れます"));
  } else {
    for (const run of active) runsBox.appendChild(buildCard(run));
  }
  liveRestore(runsBox);

  const chips = document.getElementById("chips");
  chips.replaceChildren();
  if (resting.length === 0) {
    chips.appendChild(el("span", "chip", "まだありません"));
  } else {
    for (const run of resting) chips.appendChild(buildChip(run));
  }

  if (focusDraft) {
    const revived = document.querySelector('textarea[data-draft-for="' + focusDraft + '"]');
    if (revived) {
      revived.focus();
      if (caret && caret[0] !== null) revived.setSelectionRange(caret[0], caret[1]);
    }
  }

  const banner = document.getElementById("notice-banner");
  banner.textContent = latestBoard.notice || "";
  banner.hidden = !latestBoard.notice;
  const needAttention = active.filter(run => ACTIONABLE.has(run.step) || run.step === "attention").length;
  const counts = document.getElementById("counts");
  counts.replaceChildren();
  counts.appendChild(document.createTextNode("処理中 "));
  counts.appendChild(el("b", null, String(active.length)));
  counts.appendChild(document.createTextNode(" ／ 要対応 "));
  counts.appendChild(el("b", needAttention > 0 ? "warn" : null, String(needAttention)));
  counts.appendChild(document.createTextNode(" ／ 完了・終了 "));
  counts.appendChild(el("b", null, String(resting.length)));
}

/* ---- event log (idempotent inserts, day separators) ---- */
function eventID(event) { return (event.at || "") + "|" + (event.delivery_id || "") + "|" + (event.step || ""); }

function renderEvents(events, fresh) {
  const log = document.getElementById("log");
  for (const event of events) {
    const id = eventID(event);
    if (knownEvents.has(id)) continue;
    knownEvents.add(id);
    const row = el("div", "ev" + (fresh ? " enter fresh" : ""));
    const when = event.at ? new Date(event.at) : null;
    const stamp = when ? String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0") : "—";
    row.appendChild(el("time", null, stamp));
    const body = el("div");
    body.appendChild(el("div", "ekey", event.issue_key || event.delivery_id || ""));
    body.appendChild(el("div", "emsg", (event.step_title || event.step || "") + (event.detail ? " — " + event.detail : "")));
    row.appendChild(body);
    log.prepend(row);
    if (fresh) {
      requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add("settling")));
      setTimeout(() => row.classList.remove("fresh"), 2600);
      setTimeout(() => row.classList.remove("enter", "settling"), 1500);
    }
  }
}

/* ---- live feed ---- */
function applyPayload(payload, firstLoad) {
  lastPayloadAt = Date.now();
  lastServerSentAt = payload.sent_at || null;
  trackerBase = payload.tracker_base || "";
  actionsEnabled = !!payload.actions_enabled;
  sentActions = new Map();
  for (const raw of payload.actions || []) {
    try {
      const action = typeof raw === "string" ? JSON.parse(raw) : raw;
      if (action && action.action && action.issue_id) sentActions.set(actKey(action.action, action.issue_id, action.delivery_id), action.at);
    } catch (_) { /* skip torn line */ }
  }
  try { latestBoard = typeof payload.board === "string" ? JSON.parse(payload.board) : (payload.board || { runs: [] }); }
  catch (_) { latestBoard = { runs: [] }; }
  document.getElementById("footer").textContent = actionsEnabled
    ? "LASSDAS STATUS BOARD — 操作（Go・停止・確認済み）は依頼者のコメントとしてチケットに投稿します。質問への回答はチケットで行います。投稿後、自動処理が受け取るまで状態の更新をお待ちください。"
    : "LASSDAS STATUS BOARD — この画面は閲覧専用です。回答・承認・確認の記録はチケットのコメントで行ってください。";
  renderBoard();
  const events = (payload.events || []).map(raw => {
    try { return typeof raw === "string" ? JSON.parse(raw) : raw; } catch (_) { return null; }
  }).filter(Boolean);
  renderEvents(events, !firstLoad);
}

let source = null;
let firstLoad = true;
function connect() {
  source = new EventSource("/stream");
  source.addEventListener("board", message => {
    setConnected(true);
    try { applyPayload(JSON.parse(message.data), firstLoad); } catch (_) { /* keep last good state */ }
    firstLoad = false;
  });
  source.onerror = () => {
    setConnected(false);
    // EventSource retries network drops by itself but goes CLOSED for
    // non-2xx answers (a pod restart behind the ALB) — reconnect those.
    if (source.readyState === EventSource.CLOSED) {
      setTimeout(() => { if (source.readyState === EventSource.CLOSED) connect(); }, 5000);
    }
  };
}

function setConnected(connected) {
  document.getElementById("conn-banner").classList.toggle("on", !connected);
  const live = document.getElementById("live");
  live.classList.toggle("dead", !connected);
  document.getElementById("live-text").textContent = connected ? "ONLINE" : "再接続中…";
}

/* per-second local refresh: elapsed counters + the honest freshness line */
setInterval(() => {
  document.querySelectorAll(".elapsed").forEach(node => {
    const claimed = Number(node.dataset.claimed || 0);
    if (claimed) node.textContent = fmtElapsed(claimed);
  });
  const ago = document.getElementById("ago");
  if (!lastPayloadAt) { ago.textContent = "受信待ち…"; return; }
  const seconds = Math.floor((Date.now() - lastPayloadAt) / 1000);
  ago.textContent = "最終受信 " + (seconds < 60 ? seconds + " 秒前" : Math.floor(seconds / 60) + " 分前");
  // The attendant writes every minute; silence far beyond that is stale
  // data even if the SSE pipe itself is alive.
  if (seconds > 180) setConnected(false);
}, 1000);

connect();
</script>
</body>
</html>
