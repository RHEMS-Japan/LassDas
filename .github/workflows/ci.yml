name: ci

# Runs the full Go suite on every push and pull request. This includes
# rewrite/internal/enginepurity, the check that fails the build if a consumer
# identifier ever lands in the engine's working tree.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The standalone Go module lives in rewrite/.
  # These are local process/fixture tests, not live-model or deployment trials.
  role-chain-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rewrite
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      # The tests run on the Go the shipped image builds the engine with: the
      # version deploy/pod/Dockerfile names, at its newest release.
      - name: Read the Go the shipped image builds with
        id: image-go
        working-directory: .
        run: |
          version="$(bash .github/scripts/image-go-version.sh)"
          echo "deploy/pod/Dockerfile builds the engine with Go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ steps.image-go.outputs.version }}
          check-latest: true # The newest release of it, not one the runner has cached.
          cache: false # Fetch the module's checksum-pinned dependencies.
      - name: Say which Go the role-chain steps use
        run: go version
      - name: Build the role-chain commands
        run: go build ./...
      - name: Check the role-chain code
        run: go vet ./...
      - name: Test the role chain
        run: go test -count=1 ./...
      - name: Check concurrent execution
        run: go test -race -count=1 ./...

  role-chain-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [adversarial, remaining]
    defaults:
      run:
        working-directory: rewrite
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - name: Read the Go the shipped image builds with
        id: image-go
        working-directory: .
        run: |
          version="$(bash .github/scripts/image-go-version.sh)"
          echo "deploy/pod/Dockerfile builds the engine with Go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ steps.image-go.outputs.version }}
          check-latest: true
          cache: false
      - name: Say which Go the Python harnesses use
        run: go version
      - name: Test the selected Python harness group
        env:
          HARNESS_GROUP: ${{ matrix.group }}
        run: bash ../.github/scripts/test-harness-group.sh "$HARNESS_GROUP"

  # Preserve the existing required result: Go and both Python groups must pass.
  # A failed, canceled or skipped dependency must not silently skip this check.
  role-chain:
    needs: [role-chain-go, role-chain-python]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both complete test results
        env:
          GO_RESULT: ${{ needs['role-chain-go'].result }}
          PYTHON_RESULT: ${{ needs['role-chain-python'].result }}
        run: |
          test "$GO_RESULT" = success
          test "$PYTHON_RESULT" = success

  # Consumer-identifier and credential-shape scans are separate from
  # execution tests so that both report their results even when one fails.
  identifier-scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # The commit-message scans read the pushed range.
      - name: Read the Go the shipped image builds with
        id: image-go
        working-directory: .
        run: |
          version="$(bash .github/scripts/image-go-version.sh)"
          echo "deploy/pod/Dockerfile builds the engine with Go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ steps.image-go.outputs.version }}
          check-latest: true
          cache: false
      - name: Say which Go the scans use
        run: go version
      # Without the list the scans have nothing to look for, and this job would
      # pass having checked nothing. A repository that keeps the list sets the
      # variable IDENTIFIER_SCANS_REQUIRED to true, and there a missing list
      # fails the job. Elsewhere (a copy of this repository by any means) the
      # scans are skipped and said to be. A pull request from another
      # repository receives no secrets, so it is skipped even where the
      # variable is set. The list is read as the two scans read it: blank is
      # missing, and only separators is a list without entries, which fails.
      - name: State whether the purity scan can run
        env:
          ENGINE_PURITY_TOKENS: ${{ secrets.ENGINE_PURITY_TOKENS }}
          REQUIRED: ${{ vars.IDENTIFIER_SCANS_REQUIRED }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          list="${ENGINE_PURITY_TOKENS:-}"
          if [ "$REQUIRED" = "true" ]; then
            echo "this repository requires the list (vars.IDENTIFIER_SCANS_REQUIRED is true)"
          else
            printf 'this repository does not require the list (vars.IDENTIFIER_SCANS_REQUIRED is not true; actual value: %q)\n' "$REQUIRED"
          fi
          if [ -n "${list//[[:space:]]/}" ]; then
            if [ -z "$(printf '%s' "$list" | tr -d ',[:space:]')" ]; then
              echo "::error::ENGINE_PURITY_TOKENS is set but holds no entries - the consumer-identifier scans would fail on it"
              exit 1
            fi
            echo "consumer-identifier scans are armed"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::warning::ENGINE_PURITY_TOKENS is not set - the consumer-identifier scans are SKIPPED in this run (a pull request from another repository receives no secrets)"
          elif [ "$REQUIRED" = "true" ]; then
            echo "::error::ENGINE_PURITY_TOKENS is not set where the list is required - the consumer-identifier scans cannot run, so this job fails instead of passing with nothing checked"
            exit 1
          else
            echo "::warning::ENGINE_PURITY_TOKENS is not set - the consumer-identifier scans are SKIPPED in this run"
          fi
      - name: Scan the tracked files for consumer identifiers
        env:
          ENGINE_PURITY_TOKENS: ${{ secrets.ENGINE_PURITY_TOKENS }}
        # -v so that the log says PASS or SKIP, not only "ok".
        run: go test -count=1 -v -run '^TestWorkingTreeContainsNoConsumerIdentifiers$' ./internal/enginepurity
      - name: Scan commit messages for consumer identifiers
        # Also after a failed tree scan, so that both scans report.
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          ENGINE_PURITY_TOKENS: ${{ secrets.ENGINE_PURITY_TOKENS }}
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/scan-commit-messages.sh
      # Credentials are found by their shapes, with no list to provide, so
      # these two run in every repository and on pull requests from other
      # repositories, whatever the scans above did. The script's tests are
      # rewrite/harnesses/test_ci_credential_shapes.py.
      - name: Scan the tracked files for credential shapes
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 -B .github/scripts/scan-credential-shapes.py tree
      - name: Scan commit messages for credential shapes
        # The range the commit-message scan above reads.
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          RANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B .github/scripts/scan-credential-shapes.py messages

  # rewrite/START.md says the engine builds with the Go its go.mod names or
  # later, while the jobs above run on the Go the shipped image builds with.
  # This keeps the lower end true: the role chain builds and passes vet on the
  # version its go.mod names.
  role-chain-minimum-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rewrite
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          # A `uses:` step does not take defaults.run's directory: this names
          # the module's go.mod relative to the checkout root.
          go-version-file: rewrite/go.mod
          cache: false
      - name: Say which Go this job uses
        run: go version
      - name: Build the role-chain commands
        run: go build ./...
      - name: Check the role-chain code
        run: go vet ./...
