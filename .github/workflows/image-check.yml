name: image-check

# Builds the runtime image from every pull request the way image.yml builds it
# from main (deploy/pod/Dockerfile, natively on arm64, no cache), so a change
# that breaks the Dockerfile or the engine's packaging fails here rather than
# after the merge, when main is left without a new image. Nothing is pushed
# and no registry is logged in to: the job needs no secret, so a pull request
# from a fork runs it too. The engine packaged in the image is then started
# once on a packaged example.
#
# Publishing, anonymous pulls and the distributor's note are main-only
# operations. This job does not mutate a registry or an installation.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: runtime-check:${{ github.sha }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - name: Build (arm64, no cache, nothing pushed)
        # image.yml's arguments; only the tag is local. GITHUB_SHA is the merge
        # of this pull request into its base, the tree main would build.
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --no-cache --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" -f deploy/pod/Dockerfile .
      - name: Start the packaged engine on the packaged example
        # The same check image.yml runs before it pushes; what passes is
        # written in the script.
        run: bash .github/scripts/check-packaged-engine.sh "$IMAGE"
      - name: Build and test a small crate with the image's Rust
        # The same check image.yml runs before it pushes; what passes is
        # written in the script.
        run: bash .github/scripts/check-rust-toolchain.sh "$IMAGE"
      - name: Stop repeated failures through the packaged native SDK
        # The same check image.yml runs before it pushes; what passes is
        # written in the script.
        run: bash .github/scripts/check-native-repeated-failures.sh "$IMAGE"
      - name: Let an unprivileged process map a user namespace on this runner
        # Ubuntu 24.04's apparmor_restrict_unprivileged_userns strips the
        # capabilities of a user namespace an unconfined process creates, and
        # bubblewrap then cannot write its uid map (seen on this runner, even
        # with --privileged). The runner is a throwaway machine; the cluster
        # nodes the engine runs on do not set it.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test the small crate through the role launcher
        # The same check image.yml runs before it pushes; what passes is
        # written in the script.
        run: bash .github/scripts/check-role-sandbox.sh "$IMAGE"
      - name: Stop a role's allocating process through the launcher's memory guard
        # The same check image.yml runs before it pushes; what passes is
        # written in the script. It also runs the launcher's tests in the
        # image, where bubblewrap is.
        run: bash .github/scripts/check-role-memory-guard.sh "$IMAGE"
