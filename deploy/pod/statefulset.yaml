# The single-pod runtime (docs/RUNTIME_POD.md). Namespace: lassdas.
# Secrets (created by the operator, never in git):
#   kubectl create secret generic lassdas-engine -n lassdas \
#     --from-literal=BACKLOG_API_KEY=... \
#     --from-literal=MODEL_API_KEY_IMPLEMENTER=... \
#     --from-literal=MODEL_API_KEY_REVIEWER=... \
#     --from-literal=TARGET_GITHUB_TOKEN=...
# Config (runtime.json + m1-consumer.json), read-only in the pod:
#   kubectl create configmap lassdas-config -n lassdas --from-file=...
# The knowledge tree (runtime.json's knowledge_root, /data/instance in the
# example) lives on the state volume, not in the ConfigMap: the engine
# writes a resumed run's adopted answers into it (docs/RUNTIME_POD.md).
apiVersion: v1
kind: Namespace
metadata:
  name: lassdas
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lassdas
  namespace: lassdas
spec:
  serviceName: lassdas
  replicas: 1
  selector:
    matchLabels: { app: lassdas }
  template:
    metadata:
      labels: { app: lassdas }
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      terminationGracePeriodSeconds: 120
      tolerations:
        - key: lassdas
          operator: Equal
          value: "true"
          effect: NoSchedule
      nodeSelector:
        lassdas: "true"
      # The probes' identity is the projected token the spec mounts on
      # purpose; the default token would be one more file the agent user
      # could read (docs/RUNTIME_POD.md, "Agents under their own user").
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: engine
          image: <ECR>/lassdas-runtime@sha256:<digest>  # digest 指定 (latest 禁止)
          envFrom:
            - secretRef: { name: lassdas-engine }
            # The status board's credentials and the requester's tracker
            # key (deploy/pod/statusboard.yaml). Optional: without it the
            # board process refuses to start and the pod runs unchanged.
            - secretRef: { name: lassdas-board, optional: true }
          env:
            - name: LASSDAS_STATE_DIR
              value: /data
            - name: LASSDAS_RUNTIME_CONFIG
              value: /etc/lassdas/runtime.json
            - name: BACKLOG_DOMAIN
              value: <space>.backlog.com
            - name: LASSDAS_E2E_SESSION_FILE
              value: /etc/lassdas-e2e/session.json
          # No securityContext here on purpose: the agent launcher relies on
          # file capabilities, which allowPrivilegeEscalation: false would
          # drop at exec (docs/RUNTIME_POD.md, "Agents under their own user").
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: config, mountPath: /etc/lassdas/config, readOnly: true }
            # The operator's observation seed (optional). 0440 with the
            # pod's fsGroup keeps it readable by the engine's user alone;
            # with the default 0644 the agent user could read it, and the
            # entrypoint refuses to boot.
            - { name: e2e-session, mountPath: /etc/lassdas-e2e, readOnly: true }
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - 'test $(( $(date +%s) - $(stat -c %Y /data/heartbeat) )) -lt 300'
            initialDelaySeconds: 120
            periodSeconds: 60
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: config
          configMap: { name: lassdas-config }
        - name: e2e-session
          secret: { secretName: lassdas-e2e-session, optional: true, defaultMode: 0440 }
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 20Gi }
