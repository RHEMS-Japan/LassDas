name: image-check

# Builds the runtime image from every pull request the way image.yml builds it
# from main (deploy/pod/Dockerfile, natively on arm64, no cache), so a change
# that breaks the Dockerfile or the engine's packaging fails here rather than
# after the merge, when main is left without a new image. Nothing is pushed
# and no registry is logged in to: the job needs no secret, so a pull request
# from a fork runs it too. The engine packaged in the image is then started
# once on a packaged example.
#
# Not repeated from image.yml: the launcher test it runs inside the image
# before pushing (TestRunnerWorkspaceLaunchInImage), the push, the anonymous
# pull and the distributor's note. A pull request that breaks only those
# still passes here.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: image-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: runtime-check:${{ github.sha }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          persist-credentials: false
      - name: Build (arm64, no cache, nothing pushed)
        # image.yml's arguments; only the tag is local. GITHUB_SHA is the merge
        # of this pull request into its base, the tree main would build.
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --no-cache --pull \
            --build-arg "ENGINE_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" -f deploy/pod/Dockerfile .
      - name: Start the packaged engine on the packaged example
        # The unedited example names no intake project, so --check goes through
        # the checks a start makes before the intake and then refuses on exactly
        # that, with exit status 1: the engine started, as the image's user and
        # with no network, and read the example. Anything else fails here - a
        # success, another message, or docker unable to start it.
        run: |
          set -uo pipefail
          expected="watch requires an explicit intake.project_id"
          status=0
          output="$(docker run --rm --network none --platform linux/arm64 \
            --entrypoint /opt/ticket-automation/bundle/bin/ticket-engine "$IMAGE" \
            --config /opt/ticket-automation/bundle/examples/operator.json --check 2>&1)" || status=$?
          printf 'exit status %s\n%s\n' "$status" "$output"
          if [ "$status" -ne 1 ] || ! grep -qxF "$expected" <<<"$output"; then
            echo "::error::the packaged engine did not refuse the unedited example with \"$expected\" and exit status 1"
            exit 1
          fi
          echo "the packaged engine started and refused the unedited example as expected"
